<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - ClassSync</title>
  <meta name="description" content="Set a new secure password for your ClassSync account.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="navbar-container"></div>

  <main class="auth-container">
    <div class="card">
      <div style="text-align: center; margin-bottom: 1.5rem;">
        <div style="font-size: 2rem; color: var(--primary-color); margin-bottom: 0.5rem;">
          <i class="fa-solid fa-lock-open"></i>
        </div>
        <h1 class="page-title">Set New Password</h1>
        <p class="card-subtitle" id="reset-target-email" style="margin-bottom: 0;">Enter reset code & your new password</p>
      </div>

      <form id="reset-form">
        <div id="reset-error" class="form-error-msg" style="display: none; margin-bottom: 1rem;"></div>

        <div class="form-group">
          <label for="reset-otp">6-Digit Reset Code *</label>
          <input type="text" id="reset-otp" class="form-control" style="font-family: var(--font-mono); font-size: 1.3rem; text-align: center; letter-spacing: 8px;" placeholder="123456" maxlength="6" required>
        </div>
        <div class="form-group">
          <label for="reset-new-password">New Password *</label>
          <input type="password" id="reset-new-password" class="form-control" placeholder="Minimum 6 characters" required>
        </div>
        
        <button type="submit" class="btn btn-primary btn-block" id="reset-btn" style="padding: 0.75rem;">
          <i class="fa-solid fa-check"></i> Reset Password & Sign In
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem; color: var(--text-muted);">
        Back to <a href="/login.html" style="font-weight: 600;">Log In</a>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/navbar.js"></script>
  <script src="/js/reset-password.js"></script>
</body>
</html>
