<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - ClassSync</title>
  <meta name="description" content="Request a secure password reset OTP for your ClassSync account.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="navbar-container"></div>

  <main class="auth-container">
    <div class="card">
      <div style="text-align: center; margin-bottom: 1.5rem;">
        <div style="font-size: 2rem; color: var(--primary-color); margin-bottom: 0.5rem;">
          <i class="fa-solid fa-key"></i>
        </div>
        <h1 class="page-title">Reset Your Password</h1>
        <p class="card-subtitle" style="margin-bottom: 0;">Enter your account email to receive a password reset OTP code</p>
      </div>

      <form id="forgot-form">
        <div id="forgot-error" class="form-error-msg" style="display: none; margin-bottom: 1rem;"></div>

        <div class="form-group">
          <label for="forgot-email">Account Email Address *</label>
          <input type="email" id="forgot-email" class="form-control" placeholder="your_email@domain.com" required>
        </div>
        
        <button type="submit" class="btn btn-primary btn-block" id="forgot-btn" style="padding: 0.75rem;">
          <i class="fa-solid fa-paper-plane"></i> Send Password Reset OTP
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem; color: var(--text-muted);">
        Remembered your password? <a href="/login.html" style="font-weight: 600;">Log In</a>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/navbar.js"></script>
  <script src="/js/forgot-password.js"></script>
</body>
</html>
